[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terna-py"
dynamic = ["version"]                    # version will be read from terna/terna.py
description = "Python API wrapper for Terna transparency data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "fgenoese" }]
keywords = ["terna", "energy", "api", "electricity"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/fgenoese/terna-py"

[tool.setuptools]
packages = ["terna"]
include-package-data = true